<style>
body {
  margin: 0;
  font-family: 'Playfair Display', serif;
  color: white;
  background: black;
  overflow-x: hidden;
}

/* 🌌 SAME BACKGROUND FOR ALL PAGES */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  background: url('art.gif.gif') no-repeat center/cover;
  background-size: cover;
  z-index: -2;
  filter: brightness(0.5);
}

.overlay {
  position: fixed;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.08), transparent 60%);
  z-index: -1;
}

/* 🎬 PAGE SYSTEM */
.page {
  position: absolute;
  width: 100%;
  min-height: 100vh;
  padding: 25px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;

  opacity: 0;
  filter: blur(10px);
  transform: scale(0.98);

  transition: all 0.8s ease;
  pointer-events: none;
}

.page.active {
  opacity: 1;
  filter: blur(0);
  transform: scale(1);
  pointer-events: all;
}

/* TEXT */
#text1 {
  font-family: 'Dancing Script', cursive;
  font-size: 38px;
  max-width: 600px;
  text-align: center;
  border-right: 2px solid white;
}

/* BUTTON */
button {
  margin-top: 25px;
  padding: 12px 25px;
  border: none;
  border-radius: 25px;
  background: rgb(125, 97, 235);
  color: white;
  cursor: pointer;
  font-size: 16px;
}

/* 📸 GALLERY */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 18px;
  margin-top: 20px;
  width: 100%;
  max-width: 900px;
}

.img-box {
  background: white;
  padding: 10px 10px 30px 10px;
  border-radius: 6px;
  transform: rotate(calc(-3deg + 6deg * var(--rand)));
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  cursor: pointer;
}

.img-box img {
  width: 100%;
  height: 130px;
  object-fit: cover;
}

/* 🎥 VIDEO */
video {
  width: 100%;
  border-radius: 15px;
  max-width: 300px;
}

/* 👤 NAME GRID */
.name-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 12px;
  margin-top: 25px;
  width: 100%;
  max-width: 700px;
}

.name-grid button {
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: rgba(30, 30, 40, 0.75);
  color: white;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(0,0,0,0.6);
}

#memoryBox {
  border-radius: 30px;
  background: rgba(30, 30, 40, 0.75);
  white-space: pre-wrap;
  word-wrap: break-word;
  text-align: center;
  line-height: 1.8;
}
/* HOVER MODAL */
#hoverModal {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.85);
  padding: 15px 25px;
  border-radius: 20px;
  display: none;
  z-index: 999;
}
.cursor {
  border-right: 2px solid white;
  animation: blink 0.8s infinite;
}

@keyframes blink {
  50% { border-color: transparent; }
}
#endingText {
  max-width: 900px;
  text-align: center;
}

.line {
  opacity: 0;
  transform: translateY(20px);
  font-size: 22px;
  margin: 15px 0;
  transition: all 1.5s ease;
}

.line.show {
  opacity: 1;
  transform: translateY(0);
}

.highlight-line {
  font-size: 28px;
  font-weight: bold;
  color: #4aa3ff;
  text-shadow: 0 0 15px rgba(226, 224, 231, 0.6);
}
.ate-btn {
  grid-column: 1 / -1; /* spans entire row */
  justify-self: center; /* centers horizontally */
}
.memory-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-top: 25px;
  flex-wrap: wrap;
}

#memoryBox {
  max-width: 400px;
  padding: 20px;
}

#memoryImage {
  width: 220px;
  height: 220px;
  object-fit: cover;
  border-radius: 20px;
  display: none;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

function typeWriter() {

  document.getElementById(a).classList.remove("active");
  setTimeout(() => {

  document.getElementById("bgMusic").play();

function typeWriterMemory(text){
  const box = document.getElementById("memoryBox");
  box.innerHTML = "";

  let i = 0;
  const speed = 12;

  function type(){
    if (i < text.length) {

      let current = text.substring(0, i + 1);

      // preserve line breaks nicely while typing
      box.innerHTML = current.replace(/\n/g, "<br>") + "<span class='cursor'></span>";

      i++;

      setTimeout(type, speed);

    } else {
      box.innerHTML = text.replace(/\n/g, "<br>");
    }
  }

  type();
}
function openMemory(name){
  const message = memoryMessages[name];
  const img = document.getElementById("memoryImage");

  typeWriterMemory(message);

  if (memoryImages[name]) {
    img.src = memoryImages[name];
    img.style.display = "block";
  } else {
    img.style.display = "none";
  }
}
function playEndingScene(){

    { text: "just know this—" },

    { text: "And you always will be.", highlight: true }
  ];

  endingLines.forEach((line, i) => {
    const div = document.createElement("div");
    div.className = "line";
    div.innerText = line.text;

    if (line.highlight) {
      div.classList.add("highlight-line");
    }

    container.appendChild(div);

    setTimeout(() => {
      div.classList.add("show");
    }, i * 2000);
  });
}
